name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_FILE: myfinance        # nama file APK; ganti bersama nama tampilan (docs/GANTI_NAMA.md)
  APP_ID: app.myfinance      # applicationId: JANGAN diubah. Workflow gagal bila APK berbeda.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'   # versi yang dipakai saat pengembangan; naikkan dengan sengaja
          cache: true

      - name: Hitung versi
        id: ver
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NUM="$GITHUB_RUN_NUMBER"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME.$NUM" >> "$GITHUB_OUTPUT"

      - name: Pastikan tag belum ada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG sudah ada. Rilis dibatalkan agar tidak menimpa rilis lama."
            exit 1
          fi

      # Kode hasil generate (drift: *.g.dart) di-commit, jadi build_runner tidak dijalankan di CI.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diisi. Rilis dibatalkan agar APK tidak ditandatangani debug."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          # Uji keystore dan alias (password lewat env, keluaran dibuang).
          if ! keytool -list -keystore android/app/upload-keystore.jks \
                 -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore tidak bisa dibuka (cek KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS)."
            exit 1
          fi

      - name: Build APK
        env:
          NAME: ${{ steps.ver.outputs.name }}
          NUM: ${{ steps.ver.outputs.num }}
        run: >
          flutter build apk --release --split-per-abi
          --build-name="$NAME" --build-number="$NUM"

      - name: Verifikasi tanda tangan dan isi APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="${BT}apksigner"; AAPT2="${BT}aapt2"
          echo "build-tools: $(basename "$BT")"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ "${#apks[@]}" -ne 3 ]; then
            echo "::error::Diharapkan 3 APK, ditemukan ${#apks[@]}."; exit 1
          fi
          first=""
          for apk in "${apks[@]}"; do
            echo "== $(basename "$apk")"
            if ! certs=$("$APKSIGNER" verify --print-certs "$apk" 2>&1); then
              echo "::error::Verifikasi tanda tangan gagal: $(basename "$apk")"; exit 1
            fi
            if echo "$certs" | grep -qi "Android Debug"; then
              echo "::error::$(basename "$apk") bertanda tangan DEBUG. Rilis dibatalkan."; exit 1
            fi
            sha=$(echo "$certs" | grep -i "certificate SHA-256 digest" | head -1 | sed 's/.*: *//')
            echo "sertifikat SHA-256: $sha"
            [ -z "$first" ] && first="$sha"
            if [ "$sha" != "$first" ]; then
              echo "::error::Sertifikat antar-APK berbeda."; exit 1
            fi
            pkg=$("$AAPT2" dump packagename "$apk")
            if [ "$pkg" != "$APP_ID" ]; then
              echo "::error::applicationId '$pkg' bukan '$APP_ID'."; exit 1
            fi
            if "$AAPT2" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "::error::APK meminta izin INTERNET."; exit 1
            fi
            perms=$("$AAPT2" dump permissions "$apk")
            echo "$perms"
            # Satu-satunya izin yang disengaja untuk fitur scan faktur: CAMERA (lihat tool/cek_izin.sh).
            if ! echo "$perms" | grep -q "android.permission.CAMERA"; then
              echo "::error::APK tidak memuat izin CAMERA (fitur scan faktur)."; exit 1
            fi
            echo "OK: tanda tangan rilis, package $pkg, tanpa INTERNET, ada CAMERA"
          done

      - name: Ganti nama APK
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/${APP_FILE}-${TAG}-$abi.apk"
          done
          ls -l dist

      - name: Buat tag dan release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: >
          gh release create "$TAG" dist/*.apk
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
          --latest

      - name: Hapus keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
